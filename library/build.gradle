plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = 'com.threedrd'
version = '0.1.0-SNAPSHOT'

android {
    namespace = 'com.threedrd.quanomous'
    compileSdk 34
    defaultConfig { minSdk 24 }
    sourceSets { test.resources.srcDir rootProject.file('fixtures') }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    publishing { singleVariant('release') { withSourcesJar() } }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8 } }

dependencies {
    api 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    repositories {
        maven {
            name = 'Review'
            url = rootProject.layout.buildDirectory.dir('repository')
        }
    }
}
afterEvaluate {
    publishing.publications {
        release(MavenPublication) {
            from components.release
            artifactId = 'quanomous'
            pom {
                name = 'Quanomous'
                description = 'Dynamic autonomous routine decoding, storage and compilation for FTC teams.'
                url = 'https://github.com/3DRoboticsDuluth/Quanomous'
                licenses {
                    license {
                        name = 'BSD 3-Clause License'
                        url = 'https://opensource.org/license/bsd-3-clause'
                    }
                }
                scm { url = 'https://github.com/3DRoboticsDuluth/Quanomous' }
            }
        }
    }
}
