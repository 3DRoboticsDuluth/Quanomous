name: Stage Maven Central release

# Never publishes on push, tag creation, PR, or merge.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing vX.Y.Z tag reachable from main (enter X.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected X.Y.Z'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/v${RELEASE_VERSION}^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify tagged source without release credentials
        run: |
          node builder/test-templates.cjs
          bash ./gradlew :library:check :library:assembleRelease :library:publishReleasePublicationToReviewRepository --max-workers=2 --console=plain
          bash ./gradlew -p examples :java:assembleRelease :kotlin:assembleRelease --refresh-dependencies --max-workers=2 --console=plain
          python3 scripts/check-artifacts.py

  stage-central:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Main-only environment; secrets are scoped here. Reviewers are optional (currently disabled).
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Sign and upload for Central Portal validation
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          bash ./gradlew :library:publishToMavenCentral -PcentralRelease=true "-PreleaseVersion=$RELEASE_VERSION" --no-configuration-cache --max-workers=2 --console=plain
      - name: Next step
        run: echo 'Upload only. Review validation and explicitly Publish in Central Portal when authorized.'
